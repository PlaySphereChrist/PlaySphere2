<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- brown background -->
  <rect x="0" y="0" width="64" height="64" rx="14" fill="#6F4E37"/>

  <!-- outer sphere boundary -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="#FFFFFF" stroke-width="1.4" opacity="0.7"/>

  <!-- two crossing orbit rings -->
  <ellipse cx="32" cy="32" rx="24" ry="9"
           fill="none" stroke="#FFFFFF" stroke-width="2"
           stroke-dasharray="3 3"/>
  <ellipse cx="32" cy="32" rx="9" ry="24"
           fill="none" stroke="#FFFFFF" stroke-width="2"
           stroke-dasharray="3 3"
           transform="rotate(35 32 32)"/>

  <!-- nucleus -->
  <circle cx="32" cy="32" r="3.6" fill="#FFFFFF"/>
</svg>
